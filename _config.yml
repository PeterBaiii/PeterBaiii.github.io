# Built by GitHub Pages' Jekyll on every push.
# Blog posts go in _blogs/, lecture notes in _lecture_notes/ (Markdown).
# A Chinese version goes in the zh/ subfolder under the same file name.

title: Xinyu (Peter) Bai
url: https://peterbaiii.github.io

# Publish posts even if their date is still in the future on the build
# server's clock (UTC), e.g. a post written in the morning in China.
future: true

# Repository files, not pages.
exclude:
  - README.md
  - LICENSE

markdown: kramdown
kramdown:
  input: GFM
  # $$...$$ becomes \(...\) or \[...\], rendered by KaTeX in the browser.
  math_engine: mathjax

collections:
  blogs:
    output: true
    permalink: /blogs/:name/
  lecture_notes:
    output: true
    permalink: /lecture-notes/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: blogs
    values:
      layout: note
  - scope:
      type: lecture_notes
    values:
      layout: note
  - scope:
      path: _blogs/zh
    values:
      lang: zh-CN
      permalink: /blogs/zh/:name/
  - scope:
      path: _lecture_notes/zh
    values:
      lang: zh-CN
      permalink: /lecture-notes/zh/:name/
